<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativação de e-SIM · Meu Vivo Empresas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #6A0DA6;
    --purple-dark: #52086F;
    --purple-deep: #5A0090;
    --purple-panel: #5E0A8F;
    --purple-tint: #F4EBFB;
    --blue: #0D4FC4;
    --blue-dark: #0A3D99;
    --plum: #4B0873;
    --green: #1E9E4B;
    --gray-900: #1B1B1F;
    --gray-700: #4A4A52;
    --gray-500: #737380;
    --gray-400: #9A9AA5;
    --gray-300: #C7C6D1;
    --gray-200: #E2E1EA;
    --gray-100: #F1F0F6;
    --gray-50: #F9F8FC;
    --white: #FFFFFF;
    --font-heading: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --radius: 6px;
    --shadow-drawer: -12px 0 40px rgba(30,10,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--gray-900);
    background:var(--white);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  a{cursor:pointer;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 48px; height:78px; border-bottom:1px solid var(--gray-200);
    flex-wrap:wrap; gap:16px;
  }
  .topbar-left{display:flex; align-items:center; gap:48px; height:100%;}
  .hamburger-btn{
    display:none; background:none; border:none; width:34px; height:34px; padding:0;
    color:var(--gray-900); align-items:center; justify-content:center; flex-shrink:0;
  }
  .hamburger-btn svg{width:20px; height:16px;}
  .logo{display:flex; align-items:center; height:100%;}
  .logo img{display:block; height:22px; width:auto; user-select:none;}
  nav.tabs{display:flex; align-items:center; gap:32px; height:100%;}
  nav.tabs a{
    display:flex; align-items:center; height:100%;
    font-size:15.5px; color:var(--gray-500); text-decoration:none;
    position:relative; line-height:1;
    transition:color .15s;
  }
  nav.tabs a::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent;
  }
  nav.tabs a.active{color:var(--gray-900); font-weight:500;}
  nav.tabs a.active::after{background:var(--purple);}
  nav.tabs a.disabled{opacity:.45; cursor:not-allowed;}
  nav.tabs a:not(.disabled):not(.active):hover{color:var(--gray-900);}
  .topbar-right{text-align:right; font-size:13.5px; display:flex; align-items:center; gap:22px; height:100%;}
  .user-chip{display:flex; align-items:center; gap:6px; color:var(--gray-900); font-weight:500; cursor:pointer;}
  .user-chip svg{width:12px; opacity:.6;}
  .account-info{color:var(--gray-700); line-height:1.5; display:flex; align-items:center;}
  .account-info b{color:var(--gray-900); font-weight:500;}
  .account-info a{color:var(--purple); text-decoration:none; font-weight:500; margin-left:6px;}
  .account-info a:hover{text-decoration:underline;}

  /* ---------- MAIN CONTENT ---------- */
  main.content{
    max-width:1180px; margin:0 auto; padding:56px 48px 100px;
    transition:filter .25s ease;
  }
  .eyebrow{
    font-size:13px; letter-spacing:1.2px; color:var(--gray-500); font-weight:500;
    margin-bottom:10px;
  }
  .back-nav{
    display:flex; align-items:center; gap:7px; background:none; border:none; padding:0;
    color:var(--gray-700); font-size:14px; font-weight:500; margin-bottom:22px;
  }
  .back-nav svg{width:14px; height:14px;}
  .back-nav:hover{color:var(--purple);}
  h1.page-title{
    font-family:var(--font-heading);
    font-size:36px; font-weight:500; color:var(--gray-900); margin:0 0 34px; letter-spacing:-.2px;
  }

  .mode-toggle{display:flex; gap:28px; margin-bottom:22px;}
  .radio-inline{display:flex; align-items:center; gap:9px; font-size:16px; color:var(--gray-900);}
  .radio-inline input{accent-color:var(--purple); width:16px; height:16px;}

  .search-box{
    position:relative; max-width:480px;
  }
  .search-field{
    border:1px solid var(--gray-300); border-radius:var(--radius);
    padding:14px 56px 14px 20px; transition:border-color .15s; background:var(--white);
  }
  .search-field:focus-within{border-color:var(--purple);}
  .search-field label{display:block; font-size:13.5px; color:var(--gray-500); margin-bottom:6px; line-height:1;}
  .search-field input{
    width:100%; border:none; outline:none; padding:0; margin:0; background:none;
    font-size:17px; color:var(--gray-900); font-family:inherit;
  }
  .search-field input::placeholder{color:var(--gray-400);}
  .search-icon-btn{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:none; border:none; padding:6px; color:var(--gray-600); display:flex;
  }
  .search-icon-btn:hover{color:var(--purple);}
  .search-icon-btn svg{width:24px; height:24px;}
  .search-hints{margin-top:10px; font-size:12.5px; color:var(--gray-400);}
  .search-hints button{
    background:none; border:none; color:var(--purple); font-size:12.5px; padding:0;
    text-decoration:underline; font-weight:500;
  }

  .search-meta{
    display:flex; align-items:center; gap:16px; margin:18px 0 24px; font-size:13.5px; color:var(--gray-500);
  }
  .search-meta a{color:var(--purple); text-decoration:none; font-weight:500;}
  .search-meta a:hover{text-decoration:underline;}

  .filters{display:flex; gap:26px; margin-bottom:22px;}
  .filters label{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--gray-700);}
  .filters input{accent-color:var(--purple); width:15px; height:15px;}

  /* empty state */
  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:30px 0 10px;
  }
  .empty-state p{font-size:16px; color:var(--gray-700); margin-top:26px;}
  .empty-illustration{width:100%; max-width:340px; height:auto; display:block;}

  /* table */
  table.data-table{width:100%; border-collapse:collapse; font-size:15.5px;}
  table.data-table thead th{
    text-align:left; font-weight:500; color:var(--gray-500); font-size:13px;
    background:var(--gray-50); padding:14px 18px; border-bottom:1px solid var(--gray-200);
  }
  table.data-table tbody td{
    padding:22px 18px; border-bottom:1px solid var(--gray-100); color:var(--gray-900); vertical-align:middle;
  }
  table.data-table tbody tr.row-hidden{display:none;}
  .status-ativa{color:var(--green); font-weight:500;}
  .status-inativa{color:var(--gray-400); font-weight:500;}
  .status-bloqueada{color:#C0392B; font-weight:500;}
  .btn-row{
    background:var(--purple); color:var(--white); border:none; padding:14px 30px;
    border-radius:var(--radius); font-size:14.5px; font-weight:500;
  }
  .btn-row:hover{background:var(--purple-dark);}
  .btn-row.outline{background:none; border:1px solid var(--purple); color:var(--purple);}
  .btn-row.outline:hover{background:var(--purple-tint);}
  .protocol{margin-top:20px; font-size:12.5px; color:var(--gray-400);}

  .footnote{
    max-width:1180px; margin:70px auto 0; padding:0 48px; font-size:12px; color:var(--gray-400); border-top:1px solid var(--gray-100); padding-top:18px;
  }

  /* ---------- OVERLAY + DRAWER ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,8,32,0.45); opacity:0; pointer-events:none;
    transition:opacity .28s ease; z-index:40;
  }
  .overlay.open{opacity:1; pointer-events:auto;}

  .drawer{
    position:fixed; top:0; right:0; height:100vh; width:600px; max-width:92vw;
    background:var(--white); box-shadow:var(--shadow-drawer);
    transform:translateX(100%); transition:transform .32s cubic-bezier(.4,0,.2,1);
    z-index:50; overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer.is-panel{background:var(--purple-panel); color:var(--white);}
  .drawer-topbar{
    display:flex; justify-content:space-between; align-items:center; padding:22px 30px 0;
  }
  .drawer-topbar button{
    background:none; border:none; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:var(--gray-700);
    font-size:20px;
  }
  .drawer-topbar button:hover{background:var(--gray-100);}
  .drawer.is-panel .drawer-topbar button{color:var(--white);}
  .drawer.is-panel .drawer-topbar button:hover{background:rgba(255,255,255,.14);}
  .drawer-topbar .back-btn{opacity:1; visibility:visible;}
  .drawer-topbar .back-btn.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .drawer-body{padding:14px 46px 60px;}

  .d-eyebrow{font-size:12px; letter-spacing:1.1px; color:var(--gray-500); font-weight:500; margin-bottom:8px;}
  .d-phone-row{display:flex; align-items:center; gap:12px; margin-bottom:30px;}
  .d-phone{font-size:22px; font-weight:500; color:var(--gray-900);}
  .badge-ativa{
    background:#E9F8EE; color:var(--green); font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:20px;
  }

  /* stepper */
  .stepper{display:flex; align-items:center; margin-bottom:34px;}
  .step{display:flex; flex-direction:column; align-items:center; position:relative; flex:0 0 auto; width:70px;}
  .step-line{flex:1; height:2px; background:var(--gray-200); margin:0 -2px 20px; position:relative; top:-1px;}
  .step-line.filled{background:var(--purple);}
  .dot{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--gray-300);
    display:flex; align-items:center; justify-content:center; margin-bottom:8px; background:var(--white);
  }
  .dot.current{border-color:var(--purple);}
  .dot.current::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--purple);}
  .dot.done{border-color:var(--purple); background:var(--purple);}
  .dot.done::after{content:'✓'; color:var(--white); font-size:11px; font-weight:700;}
  .step-label{font-size:12.5px; color:var(--gray-500); white-space:nowrap;}
  .step-label.active-label{color:var(--gray-900); font-weight:500;}

  .d-title{font-family:var(--font-heading); font-size:25px; font-weight:500; line-height:1.35; color:var(--gray-900); margin:0 0 28px; max-width:440px;}

  .field{margin-bottom:8px;}
  .field-wrap{position:relative;}
  .field label.floating{
    position:absolute; top:-9px; left:14px; background:var(--white); padding:0 6px;
    font-size:12px; color:var(--gray-500);
  }
  .field input, .field .radio-group{width:100%;}
  .field input[type=text]{
    width:100%; padding:22px 44px 10px 16px; border:1px solid var(--gray-300); border-radius:var(--radius);
    font-size:15px; color:var(--gray-900); outline:none;
  }
  .field input[type=text]:focus{border-color:var(--purple);}
  .field input[readonly]{background:var(--gray-50); color:var(--gray-700);}
  .info-icon{
    position:absolute; right:14px; top:19px; width:17px; height:17px; border-radius:50%;
    border:1px solid var(--gray-400); color:var(--gray-500); font-size:11px; font-style:italic;
    display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; cursor:default;
  }
  .tooltip-wrap{position:relative; display:inline-flex; align-items:center; gap:7px;}
  .tooltip{
    display:none; position:absolute; top:50%; transform:translateY(-50%); left:calc(100% + 14px); width:220px;
    background:#2B2B33; color:#EDEDF2; font-size:12.5px; line-height:1.5; padding:14px 16px;
    border-radius:8px; z-index:5; box-shadow:0 8px 24px rgba(0,0,0,.22);
  }
  .info-icon:hover + .tooltip, .tooltip-wrap:hover .tooltip{display:block;}
  .info-icon-inline{
    position:static; flex:0 0 auto; width:15px; height:15px; border-radius:50%;
    border:1px solid var(--gray-400); color:var(--gray-500); font-size:10px; font-style:italic;
    font-family:Georgia,serif; display:inline-flex; align-items:center; justify-content:center;
  }
  .helper-text{font-size:12.5px; color:var(--gray-500); line-height:1.5; margin:10px 0 0;}
  .link-purple{color:var(--purple); font-size:13.5px; text-decoration:none; font-weight:500; display:inline-block; margin-top:16px;}
  .link-purple:hover{text-decoration:underline;}

  .radio-card-list{display:flex; flex-direction:column; gap:20px; margin-bottom:8px;}
  .radio-card{display:flex; align-items:center; gap:12px; font-size:15.5px; color:var(--gray-900); position:relative;}
  .radio-card input{width:18px; height:18px; accent-color:var(--purple);}
  .warning-box{
    display:flex; gap:10px; background:#FDF3E9; border:1px solid #F0D9B8; color:#8A5B0C;
    padding:14px 16px; border-radius:var(--radius); font-size:13px; line-height:1.5; margin-top:6px;
  }

  .btn-primary{
    background:var(--purple); color:var(--white); border:none; padding:17px 30px;
    border-radius:var(--radius); font-size:15.5px; font-weight:500; margin-top:34px; width:100%;
    max-width:320px; transition:background .15s, opacity .15s;
  }
  .btn-primary:hover:not(:disabled){background:var(--purple-dark);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}

  .opt-label{font-size:12px; letter-spacing:1.1px; color:var(--gray-500); font-weight:500; margin:36px 0 16px;}
  .opt-cards{display:flex; gap:16px;}
  .opt-card{
    flex:1; border-radius:10px; padding:22px; color:var(--white); font-size:16px; font-weight:500;
    line-height:1.35; min-height:126px; display:flex; flex-direction:column; justify-content:space-between;
    border:none; text-align:left;
  }
  .opt-card.blue{background:var(--blue);}
  .opt-card.blue:hover{background:var(--blue-dark);}
  .opt-card.plum{background:var(--plum);}
  .opt-card.plum:hover{background:#3A0658;}
  .opt-card svg{width:30px; height:30px; opacity:.9;}

  .info-block{
    border:1px solid var(--gray-200); border-radius:10px; padding:22px; margin-top:26px; position:relative; overflow:hidden;
  }
  .info-block .ib-title{font-size:15.5px; font-weight:500; color:var(--gray-900); margin-bottom:6px;}
  .info-block .ib-sub{font-size:13px; color:var(--gray-500); margin-bottom:10px;}
  .info-block a{color:var(--purple); font-size:13.5px; font-weight:500; text-decoration:none;}
  .info-block a:hover{text-decoration:underline;}
  .ib-art{
    position:absolute; right:-10px; bottom:-10px; width:160px; height:120px;
    background:linear-gradient(135deg, var(--purple) 0%, #9A3FD1 100%); border-radius:16px 0 0 0;
    opacity:.95;
  }

  .field-static{margin-bottom:26px;}
  .field-static .fs-label{font-size:12px; letter-spacing:.6px; color:var(--gray-500); margin-bottom:6px;}
  .field-static .fs-value{font-size:15.5px; color:var(--gray-900);}

  /* success screens */
  .success-icon{
    width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; margin-bottom:26px;
  }
  .qr-box{
    background:var(--white); border-radius:10px; padding:20px; width:220px; margin:26px 0;
  }
  .qr-box svg{display:block; width:100%; height:auto;}
  .panel-title{font-family:var(--font-heading); font-size:26px; line-height:1.35; font-weight:500; margin:0 0 20px; max-width:440px; color:var(--white);}
  .panel-body{font-size:14.5px; line-height:1.6; max-width:420px; color:var(--white); opacity:.92;}
  .panel-actions{display:flex; align-items:center; gap:26px; margin-top:46px; flex-wrap:wrap;}
  .btn-outline-white{
    background:none; border:1px solid rgba(255,255,255,.6); color:var(--white); padding:15px 28px;
    border-radius:var(--radius); font-size:14.5px; font-weight:500;
  }
  .btn-outline-white:hover{background:rgba(255,255,255,.1);}
  .link-white{color:var(--white); font-size:14px; text-decoration:underline; opacity:.9; background:none; border:none;}
  .white-panel-download{color:var(--white); font-size:13.5px; text-decoration:underline; display:inline-block; margin-top:2px;}
  .white-panel-help{color:var(--white); font-size:13.5px; text-decoration:underline; display:block; margin-top:16px; opacity:.9;}

  /* manufacturer help screen */
  .manu-grid{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--gray-200); margin-top:10px;}
  .manu-row{
    display:flex; align-items:center; justify-content:space-between; padding:17px 4px;
    border-bottom:1px solid var(--gray-200); font-size:15px; color:var(--gray-900); background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
  }
  .manu-row:hover{color:var(--purple);}
  .manu-detail{background:var(--gray-50); border-radius:10px; padding:20px; font-size:13.5px; color:var(--gray-700); line-height:1.6; margin-top:18px;}

  ::selection{background:var(--purple-tint);}

  /* loading spinner */
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner{
    width:15px; height:15px; border-radius:50%; display:inline-block; vertical-align:-3px;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite;
  }
  .spinner.dark{ border-color:rgba(106,13,166,.25); border-top-color:var(--purple); }
  button.is-loading{ opacity:.9; cursor:progress; pointer-events:none; }
  .search-icon-btn.is-loading{ pointer-events:none; }

  @media (max-width:760px){
    .topbar{
      height:auto; align-items:center; padding:14px 20px; gap:10px; position:relative;
    }
    .topbar-left{min-width:0; flex:1 1 auto; gap:14px; justify-content:space-between;}
    .logo img{height:18px;}
    .hamburger-btn{display:flex;}
    nav.tabs{
      display:none; position:absolute; top:100%; left:0; right:0;
      flex-direction:column; align-items:stretch; gap:0;
      background:var(--white); box-shadow:0 14px 28px rgba(20,10,35,.14);
      padding:6px 20px 10px; z-index:56; overflow-x:visible;
    }
    nav.tabs.open{display:flex;}
    nav.tabs a{
      flex-shrink:1; width:100%; padding:14px 2px; border-bottom:1px solid var(--gray-100);
    }
    nav.tabs a.active::after{display:none;}
    nav.tabs a.active{color:var(--purple);}
    .menu-overlay{
      display:none; position:fixed; inset:0; background:rgba(20,8,32,.35); z-index:54;
    }
    .menu-overlay.open{display:block;}
    .topbar-right{
      flex-direction:column; align-items:flex-end; gap:6px; width:100%;
      padding-top:12px; margin-top:2px; border-top:1px solid var(--gray-100); font-size:12.5px;
    }
    .account-info{flex-wrap:wrap; justify-content:flex-end; text-align:right;}

    main.content{padding:28px 20px 70px;}
    .footnote{padding:0 20px; margin-top:50px;}
    h1.page-title{font-size:27px; margin-bottom:24px;}
    .eyebrow{margin-bottom:8px;}

    .search-box{max-width:100%;}
    .mode-toggle{flex-wrap:wrap; gap:16px; margin-bottom:18px;}
    .filters{flex-wrap:wrap; gap:14px 20px;}

    .table-scroll{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -20px; padding:0 20px; width:calc(100% + 40px);}
    table.data-table{min-width:640px;}

    .drawer{width:100%; max-width:100%;}
    .drawer-body{padding:14px 24px 60px;}
    .d-title{font-size:22px;}
    .panel-title{font-size:23px;}
    .opt-cards{flex-direction:column;}
    .stepper{margin-bottom:28px;}
    .step{width:56px;}
    .step-label{font-size:11.5px;}
    .qr-box{width:100%; max-width:220px;}
    .panel-actions{gap:16px;}
    .field input[type=text], .search-field input{font-size:16px;}

    .tooltip{
      left:0; right:auto; top:calc(100% + 10px); transform:none; width:200px; max-width:calc(100vw - 64px);
    }
  }
</style>
</head>
<body>

/* ============================================================
   MOBILE HAMBURGER MENU
============================================================ */
(function(){
  const btn = document.getElementById('hamburgerBtn');
  const nav = document.getElementById('navTabs');
  const overlay = document.getElementById('menuOverlay');
  const iconHamburger = `<svg viewBox="0 0 20 16" fill="none"><path d="M1 1h18M1 8h18M1 15h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const iconClose = `<svg viewBox="0 0 20 16" fill="none"><path d="M2 1l16 14M18 1L2 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  function closeMenu(){
    nav.classList.remove('open');
    overlay.classList.remove('open');
    btn.innerHTML = iconHamburger;
  }
  function toggleMenu(){
    const isOpen = nav.classList.toggle('open');
    overlay.classList.toggle('open', isOpen);
    btn.innerHTML = isOpen ? iconClose : iconHamburger;
  }
  btn.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', closeMenu);
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  window.addEventListener('resize', () => { if(window.innerWidth > 760) closeMenu(); });
})();

/* ============================================================
   LOADING HELPER — small delay + spinner on actions that
   "process" something, so the prototype doesn't feel instant
============================================================ */
function withLoading(btn, fn, opts){
  opts = opts || {};
  if(!btn || btn.classList.contains('is-loading')) return;
  const delay = opts.delay || 550;
  const variant = opts.variant || '';
  const label = opts.label;
  const original = btn.innerHTML;
  btn.classList.add('is-loading');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner ${variant}"></span>${label ? ' '+label : ''}`;
  setTimeout(() => {
    fn();
    // if the button is still around (screen didn't change), restore it
    if(document.body.contains(btn)){
      btn.classList.remove('is-loading');
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }, delay);
}

function qrSvg(seed){
  // deterministic pseudo-random QR-like pattern from a seed string
  let h = 0;
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  function rnd(){ h = (h*1103515245 + 12345) >>> 0; return (h >>> 16) / 65535; }
  const n = 21, cell = 10;
  let rects = '';
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const isFinder = (x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
      let on;
      if(isFinder){
        const lx = x<7?x:(x>n-8?x-(n-7):x), ly = y<7?y:(y>n-8?y-(n-7):y);
        on = (lx===0||lx===6||ly===0||ly===6)||(lx>=2&&lx<=4&&ly>=2&&ly<=4);
      } else {
        on = rnd() > 0.58;
      }
      if(on) rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${n*cell} ${n*cell}" xmlns="http://www.w3.org/2000/svg" fill="#1B1B1F">${rects}</svg>`;
}

const mainEl = document.getElementById('mainContent');

function renderMain(){
  if(currentView === 'landing') return renderLanding();
  if(currentView === 'linha') return renderLinhaResults();
  if(currentView === 'conta') return renderContaResults();
}

function goToView(view){
  if(view !== currentView) mainHistory.push(currentView);
  currentView = view;
  renderMain();
}
function goBackMain(){
  currentView = mainHistory.length ? mainHistory.pop() : 'landing';
  renderMain();
}
function backNav(){
  return `<button class="back-nav" id="backNavBtn">${ICON.arrowLeft} Voltar</button>`;
}

function renderLanding(){
  mainEl.innerHTML = `
    <div class="eyebrow">GESTÃO DE LINHAS E CHIPS</div>
    <h1 class="page-title">Como você quer começar?</h1>
    <div class="mode-toggle">
      <label class="radio-inline"><input type="radio" name="landingMode" id="landingModeLinha" ${landingMode==='linha'?'checked':''}> Linha</label>
      <label class="radio-inline"><input type="radio" name="landingMode" id="landingModeConta" ${landingMode==='conta'?'checked':''}> Conta</label>
    </div>
    <div class="search-box">
      <div class="search-field">
        <label for="searchInput">${landingMode==='conta'?'Busque pelo número da conta':'Busque pelo número da linha com DDD'}</label>

    <div class="empty-state">

  document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') withLoading(document.getElementById('searchBtn'), doSearch, {variant:'dark', delay:500}); });
  mainEl.querySelectorAll('.search-hints button').forEach(b=>{
    b.onclick = () => {
      landingMode = b.dataset.mode; renderLanding();
      document.getElementById('searchInput').value = b.dataset.q;
      withLoading(document.getElementById('searchBtn'), doSearch, {variant:'dark', delay:500});

    document.getElementById(id).onchange = (e)=>{
      const key = id.replace('f','').toLowerCase();
      contaFilters[key] = e.target.checked;
      paintContaRows();
    };
  });
  paintContaRows();
}

function paintContaRows(){
  const tbody = document.getElementById('contaTbody');
  tbody.innerHTML = CONTA_LINES.map((l,i)=>{
    const statusLabel = l.status==='ativa'?'Ativa':(l.status==='inativa'?'Inativa':'Bloqueada');
    const statusClass = 'status-'+l.status;
    const hide = !contaFilters[l.status];
    const isTargetLine = l.numero === LINE.numero;
    const tipo = isTargetLine && esimActive ? 'E-sim' : l.tipo;
    let action;
    if(tipo === 'E-sim'){
      action = `<button class="btn-row outline" data-i="${i}" data-act="detalhe">Ver detalhes</button>`;
    } else if(l.status === 'ativa') {
      action = `<button class="btn-row" data-i="${i}" data-act="ativar">Ativar e-sim</button>`;
    } else {
      action = `<span style="color:var(--gray-400); font-size:13px;">Indisponível</span>`;
    }
    return `<tr class="${hide?'row-hidden':''}">
      <td>${l.numero}</td><td>${l.conta}</td><td>${tipo}</td>
      <td class="${statusClass}">${statusLabel}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.onclick = () => {
      const l = CONTA_LINES[+btn.dataset.i];
      withLoading(btn, () => {
        if(btn.dataset.act === 'ativar'){
          wiz = {imei:'', eid:'', sistema:'', chipType:'', flow:'activate', targetNumero:l.numero};
          openDrawer('wizardSystem');
        } else {
          openDrawer(esimActive ? 'lineDetailEsim' : 'lineDetailActive');
        }
      }, {delay:450, variant: btn.classList.contains('outline') ? 'dark' : ''});
    };
  });
}

function bindClear(){
  const btn = document.getElementById('clearBtn');
  if(btn) btn.onclick = () => { mainHistory = []; currentView='landing'; renderMain(); };
}
function bindBackNav(){
  const btn = document.getElementById('backNavBtn');
  if(btn) btn.onclick = goBackMain;
}

/* ============================================================
   DRAWER ENGINE
============================================================ */
const overlay = document.getElementById('overlay');
const drawerEl = document.getElementById('drawer');
const drawerBody = document.getElementById('drawerBody');
const backBtn = document.getElementById('backBtn');
const closeBtn = document.getElementById('closeBtn');

function openDrawer(screen){
  stack = [screen];
  overlay.classList.add('open');
  drawerEl.classList.add('open');
  renderDrawer();
}
function pushDrawer(screen){
  stack.push(screen);
  renderDrawer();
  drawerBody.scrollTop = 0;
}
function popDrawer(){
  if(stack.length > 1){ stack.pop(); renderDrawer(); }
  else closeDrawer();
}
function closeDrawer(){
  overlay.classList.remove('open');
  drawerEl.classList.remove('open');
  stack = [];
}
overlay.onclick = closeDrawer;
closeBtn.onclick = closeDrawer;
backBtn.onclick = popDrawer;

const SCREENS = {
  lineDetailActive, lineDetailEsim, viewQr, transferChoose,
  wizardSystem, wizardImei, wizardEid, wizardConfirm, wizardSuccess,
  blockConfirm, blockSuccess, reactivateConfirm, reactivateSuccess,
  simTransferSuccess, helpManufacturers
};

function renderDrawer(){
  const screen = stack[stack.length-1];
  drawerEl.classList.toggle('is-panel', screen === 'wizardSuccess');
  backBtn.classList.toggle('hidden', stack.length <= 1);
  SCREENS[screen]();
}

/* ---------- transfer flow ---------- */
function transferChoose(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">TRANSFERIR LINHA PARA OUTRO CHIP</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span><span class="badge-ativa">Ativa</span></div>
    <h2 class="d-title">O chip novo é um sim-card ou um e-sim?</h2>
    <div class="radio-card-list">
      <label class="radio-card"><input type="radio" name="chip" value="Sim-card"> Sim-card</label>
      <label class="radio-card">
        <input type="radio" name="chip" value="E-sim">
        <span class="tooltip-wrap">E-sim
          <span class="info-icon-inline">i</span>
          <span class="tooltip">Texto sobre o que é o e-Sim aqui. Texto sobre o que é o e-Sim aqui. Texto sobre o que é o e-Sim aqui.</span>
        </span>
      </label>
    </div>
    <div id="warningSlot"></div>
    <button class="btn-primary" id="transferBtn" disabled>Transferir linha</button>`;
  const radios = drawerBody.querySelectorAll('input[name=chip]');
  const warningSlot = document.getElementById('warningSlot');
  const btn = document.getElementById('transferBtn');
  radios.forEach(r=>{
    r.onchange = () => {
      wiz.chipType = r.value;
      btn.disabled = false;
      warningSlot.innerHTML = r.value === 'E-sim'
        ? `<div class="warning-box">⚠️ O aparelho que receberá este novo chip precisa ser compatível com esta tecnologia.</div>`
        : '';
    };
  });
  btn.onclick = () => {
    withLoading(btn, () => {
      if(wiz.chipType === 'E-sim'){
        wiz.flow = 'transfer'; wiz.imei=''; wiz.eid=''; wiz.sistema='';
        pushDrawer('wizardSystem');
      } else {
        pushDrawer('simTransferSuccess');
      }
    }, {delay:700, label:'Transferindo...'});
  };
}

}

/* ---------- wizard: sistema / imei / eid / confirm / success ---------- */
function stepper(current){
  const steps = wiz.flow === 'transfer'
    ? [['Sistema','sistema'],['IMEI2','imei'],['EID','eid']]
    : [['Sistema','sistema'],['IMEI','imei'],['EID','eid']];
  const idx = steps.findIndex(s=>s[1]===current);
  return `<div class="stepper">${steps.map((s,i)=>{
    const state = i<idx?'done':(i===idx?'current':'');
    const line = i>0 ? `<div class="step-line ${i<=idx?'filled':''}"></div>` : '';
    return `${line}<div class="step">
      <div class="dot ${state}"></div>
      <div class="step-label ${i===idx?'active-label':''}">${s[0]}</div>
    </div>`;
  }).join('')}</div>`;
}

function wizardSystem(){
  const title = wiz.flow === 'transfer'
    ? 'Vamos começar escolhendo o sistema do celular que receberá o e-sim'
    : 'Vamos começar escolhendo o sistema do celular que vai ter o e-sim ativado';
  drawerBody.innerHTML = `
    <div class="d-eyebrow">ATIVAÇÃO DE E-SIM</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span></div>
    ${stepper('sistema')}
    <h2 class="d-title">${title}</h2>
    <div class="radio-card-list">
      <label class="radio-card"><input type="radio" name="sistema" value="Android" ${wiz.sistema==='Android'?'checked':''}> Android</label>
      <label class="radio-card"><input type="radio" name="sistema" value="iOS (iPhone)" ${wiz.sistema==='iOS (iPhone)'?'checked':''}> iOS (iPhone)</label>
    </div>
    <button class="btn-primary" id="nextBtn" ${wiz.sistema?'':'disabled'}>Continuar</button>`;
  drawerBody.querySelectorAll('input[name=sistema]').forEach(r=>{
    r.onchange = () => { wiz.sistema = r.value; document.getElementById('nextBtn').disabled = false; };
  });
  document.getElementById('nextBtn').onclick = (e) => withLoading(e.currentTarget, () => pushDrawer('wizardImei'), {delay:400});
}

function wizardImei(){
  const isTransfer = wiz.flow === 'transfer';
  const title = isTransfer
    ? 'Informe o IMEI2 do celular com o e-sim a ser ativado'
    : 'Aqui você informa o IMEI do celular em que vai ativar o e-sim';
  const helper = isTransfer ? '' : `<p class="helper-text">Pra encontrar o IMEI é só ir em Ajustes &gt; Geral &gt; Sobre. O número que você precisa vai estar dentro de Sim Digital</p>`;
  drawerBody.innerHTML = `
    <div class="d-eyebrow">ATIVAÇÃO DE E-SIM</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span></div>
    ${stepper('imei')}
    <h2 class="d-title">${title}</h2>
    <div class="field">
      <div class="field-wrap">
        <label class="floating">Digite o IMEI</label>
        <input type="text" id="imeiInput" value="${wiz.imei}" inputmode="numeric" maxlength="20">
        <span class="info-icon">i</span>
        <span class="tooltip">Pra encontrar o IMEI é só ir em Ajustes &gt; Geral &gt; Sobre. O número que você precisa vai estar dentro de Sim Digital</span>
      </div>
      ${helper}
    </div>
    <a class="link-purple">Como encontrar o IMEI?</a><br>
    <button class="btn-primary" id="nextBtn" ${wiz.imei?'':'disabled'}>Continuar</button>`;
  const input = document.getElementById('imeiInput');
  input.oninput = () => { wiz.imei = input.value; document.getElementById('nextBtn').disabled = !input.value.trim(); };
  document.getElementById('nextBtn').onclick = (e) => withLoading(e.currentTarget, () => pushDrawer('wizardEid'), {delay:400});
}

function wizardEid(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">ATIVAÇÃO DE E-SIM</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span></div>
    ${stepper('eid')}
    <h2 class="d-title">Agora, é só informar o EID do celular que você está ativando</h2>
    <div class="field">
      <div class="field-wrap">
        <label class="floating">Digite o EID</label>
        <input type="text" id="eidInput" value="${wiz.eid}" inputmode="numeric" maxlength="34">
        <span class="info-icon">i</span>
        <span class="tooltip">Pra encontrar o EID é só ir em Ajustes &gt; Geral &gt; Sobre</span>
      </div>
      <p class="helper-text">Pra encontrar o EID é só ir em Ajustes &gt; Geral &gt; Sobre</p>
    </div>
    <a class="link-purple">Como encontrar o EID?</a><br>
    <button class="btn-primary" id="nextBtn" ${wiz.eid?'':'disabled'}>Continuar</button>`;
  const input = document.getElementById('eidInput');
  input.oninput = () => { wiz.eid = input.value; document.getElementById('nextBtn').disabled = !input.value.trim(); };
  document.getElementById('nextBtn').onclick = (e) => withLoading(e.currentTarget, () => pushDrawer('wizardConfirm'), {delay:400});
}

function wizardConfirm(){
  const label = wiz.flow === 'transfer' ? 'IMEI2' : 'IMEI';
  drawerBody.innerHTML = `
    <div class="d-eyebrow">ATIVAÇÃO DE E-SIM</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span></div>
    <h2 class="d-title">Agora é só conferir os dados pra gerar o QR Code de ativação</h2>
    <div class="field">
      <div class="field-wrap">
        <label class="floating">${label}</label>
        <input type="text" readonly value="${wiz.imei}">
      </div>
    </div>
    <div class="field" style="margin-top:22px;">
      <div class="field-wrap">
        <label class="floating">EID</label>
        <input type="text" readonly value="${wiz.eid}">
      </div>
    </div>
    <button class="btn-primary" id="genBtn">Gerar QR Code de Ativação</button>`;
  document.getElementById('genBtn').onclick = (e) => {
    withLoading(e.currentTarget, () => { esimActive = true; pushDrawer('wizardSuccess'); }, {delay:1100, label:'Gerando QR Code...'});
  };
}

function wizardSuccess(){
  const seed = wiz.imei + wiz.eid;
  drawerBody.innerHTML = `
    <div class="drawer-body-pad">
      <div class="success-icon">${ICON.mascot}</div>
      <h2 class="panel-title">Deu certo! QR code gerado.<br>Agora é só ativar o seu plano no e-sim</h2>
      <p class="panel-body">Vá em: Configurações &gt; Conexões. Para habilitar a leitura do QR code e seguir
        com o processo de ativação, procure por adicionar plano móvel ou e-sim</p>
      <div class="qr-box">${qrSvg(seed || LINE.iccid)}</div>
      <a class="white-panel-download" id="dlBtn2">Fazer download</a>
      <a class="white-panel-help" id="helpBtn2">Precisa de ajuda? Saiba como ativar o e-sim para seu dispositivo</a>
      <div class="panel-actions">
        <button class="btn-outline-white" id="okBtn">Ok, já li o QR Code</button>
        <button class="link-white" id="homeBtn">Ir pro início</button>
      </div>
    </div>`;
  wireDownload('dlBtn2', seed || LINE.iccid);
  document.getElementById('helpBtn2').onclick = () => pushDrawer('helpManufacturers');
  document.getElementById('okBtn').onclick = () => pushDrawer('lineDetailEsim');
  document.getElementById('homeBtn').onclick = closeAndReset;
}

/* ---------- block / reactivate ---------- */
function blockConfirm(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">BLOQUEAR POR PERDA OU ROUBO</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span><span class="badge-ativa">Ativa</span></div>
    <h2 class="d-title">Tem certeza que quer bloquear essa linha?</h2>
    <p style="font-size:14px; color:var(--gray-700); max-width:400px; line-height:1.6;">
      A linha ficará indisponível para ligações, SMS e internet até que você a desbloqueie ou solicite um novo chip.
    </p>
    <div class="warning-box">⚠️ Essa ação não pode ser desfeita por aqui — para desbloquear, entre em contato com o suporte.</div>
    <button class="btn-primary" id="confirmBlock" style="background:var(--plum);">Bloquear linha</button>`;
  document.getElementById('confirmBlock').onclick = (e) => withLoading(e.currentTarget, () => pushDrawer('blockSuccess'), {delay:800, label:'Bloqueando...'});
}
function blockSuccess(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">BLOQUEAR POR PERDA OU ROUBO</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span><span class="badge-ativa" style="background:#FBEAEA; color:#C0392B;">Bloqueada</span></div>
    <h2 class="d-title">Pronto, a linha foi bloqueada por perda ou roubo</h2>
    <button class="btn-primary" id="doneBtn">Ir pro início</button>`;
  document.getElementById('doneBtn').onclick = closeAndReset;
}
function reactivateConfirm(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">REATIVAR LINHA</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span></div>
    <h2 class="d-title">Quer reativar essa linha com um novo QR Code de e-sim?</h2>
    <button class="btn-primary" id="confirmReactivate">Reativar linha</button>`;
  document.getElementById('confirmReactivate').onclick = (e) => withLoading(e.currentTarget, () => pushDrawer('reactivateSuccess'), {delay:800, label:'Reativando...'});
}
function reactivateSuccess(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">REATIVAR LINHA</div>
    <div class="d-phone-row"><span class="d-phone">${LINE.numero}</span><span class="badge-ativa">Ativa</span></div>
    <h2 class="d-title">Linha reativada! Um novo QR Code foi gerado.</h2>
    <div class="qr-box">${qrSvg(LINE.iccid + 're')}</div>
    <button class="btn-primary" id="doneBtn">Ir pro início</button>`;
  document.getElementById('doneBtn').onclick = closeAndReset;
}

/* ---------- help / manufacturers ---------- */
function helpManufacturers(){
  drawerBody.innerHTML = `
    <div class="d-eyebrow">AJUDA</div>
    <h2 class="d-title">Como ativar seu plano no e-sim do seu aparelho</h2>
    <p style="font-size:14px; color:var(--gray-700);">Clique na fabricante do seu aparelho para saber como proceder</p>
    <div class="manu-grid" id="manuGrid"></div>
    <div id="manuDetail"></div>`;
  const grid = document.getElementById('manuGrid');
  grid.innerHTML = MANUFACTURERS.map((m,i)=>`<button class="manu-row" data-i="${i}">${m} <span style="color:var(--gray-300)">›</span></button>`).join('');
  grid.querySelectorAll('button').forEach(b=>{
    b.onclick = () => {
      document.getElementById('manuDetail').innerHTML = `
        <div class="manu-detail">Página ilustrativa — instruções passo a passo de como habilitar o e-sim
        em aparelhos ${MANUFACTURERS[+b.dataset.i]}, com base nos ajustes de conexão do sistema.</div>`;
    };
  });
}

/* ---------- helpers ---------- */
function wireDownload(id, seed){
  const el = document.getElementById(id);
  if(!el) return;
  el.onclick = (e) => {
    e.preventDefault();
    const svg = qrSvg(seed || 'esim');
    const blob = new Blob([svg], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'qrcode-ativacao-esim.svg';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
}
function closeAndReset(){
  closeDrawer();
  mainHistory = [];
  currentView = 'landing';
  renderMain();
}

/* ============================================================
   INIT
============================================================ */
renderMain();
</script>
